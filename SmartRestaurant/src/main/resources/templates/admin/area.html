<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../../static/css/output.css">
    <script type="module" src="../../static/js/fragments/AdminArea.js"></script>

</head>

<body>
    <app-navigation></app-navigation>
    <div class="ml-24 mr-5">
        <app-header title="Khu vực & Bàn" data-title="Quản lý khu vực và tình trạng bàn" username="Nguyễn Văn A"
            user-role="Chủ cửa hàng"></app-header>
        <div id="app-containter">
            <p-button onclick="console.log('edit')" label="Chỉnh sửa khu vực" icon="edit" id="btn-edit"></p-button>
            <p-button label="Xoá khu vực" icon="delete" variant="danger" id="btn-delete"></p-button>
            <p-button label="Lưu" variant="solid" type="submit"></p-button>
            <p-button label="Đang xử lý" disabled></p-button>
            <l-button label="Sân vườn" variant="primary"></l-button>
            <l-button label="Tầng 1" disabled></l-button>
            <l-button label="Tầng 2" variant="solid"></l-button>
        </div>
    </div>

</html>
