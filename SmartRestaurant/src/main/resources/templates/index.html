<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../static/css/output.css">
    <script type="module" src="../static/js/main.js"></script>

</head>

<body>
    <app-navigation></app-navigation>
    <div class="ml-22 mr-5 mt-5">
        <revenue-chart id="revenue-chart-days" title="Doanh thu 14 ngày gần nhất" unit="triệu VNĐ" days="14"></revenue-chart>
        <revenue-chart id="revenue-chart-mounth" title="Doanh thu tháng 10" unit="triệu VNĐ" month="2026-10"></revenue-chart>
    </div>
    <script>
        const chart = document.querySelector('#revenue-chart-days');
        const chartM = document.querySelector('#revenue-chart-mounth');

        chart.data = [
            { date: '2026-10-08', value: 2.2 },
            { date: '2026-10-07', value: 3.1 },
            { date: '2026-10-06', value: 7.5 },
        ];

        chartM.data = chart.data;
    </script>
</body>

</html>
